<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniFyn URL Shortener</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header><img src="icons/icon-48.png" alt=""><div><h1>MiniFyn</h1><p>URL Shortener</p></div></header>
    <label for="url">URL to shorten</label>
    <textarea id="url" rows="3" placeholder="https://example.com/page"></textarea>
    <div class="key-row"><label for="api-key">API key</label><button id="remove-key" type="button" class="link">Remove saved key</button></div>
    <input id="api-key" type="password" autocomplete="off" placeholder="Paste your MiniFyn API key">
    <p class="privacy">Your key is kept in this browser profile and sent only to MiniFyn when you shorten a link. <a id="key-help" href="#">Manage API key</a></p>
    <button id="shorten" type="button">Shorten URL</button>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="result" hidden><span>Short link</span><div><a id="short-url" target="_blank" rel="noreferrer"></a><button id="copy" type="button">Copy</button></div></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
